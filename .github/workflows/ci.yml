name: CI Pipeline

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]

jobs:
  test-backend:
    name: Backend Tests (Django)
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      
      - name: 📦 Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: 📚 Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt
      
      - name: 🤖 Download AI model
        working-directory: ./backend
        run: |
          python download_model.py
        continue-on-error: false
      
      - name: 🔍 Run Django checks
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
          SECRET_KEY: test-secret-key-for-ci-cd-pipeline
          DEBUG: 'True'
        run: |
          python manage.py check
      
      - name: 🗄️ Run migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
          SECRET_KEY: test-secret-key-for-ci-cd-pipeline
          DEBUG: 'True'
        run: |
          python manage.py migrate --noinput
      
      - name: 🧪 Run Django tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
          SECRET_KEY: test-secret-key-for-ci-cd-pipeline
          DEBUG: 'True'
        run: pytest -m "not ml"

  test-frontend:
    name: Frontend Tests (React)
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3
      
      - name: 📦 Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './frontend_finale/package-lock.json'
      
      - name: 📚 Install dependencies
        working-directory: ./frontend_finale
        run: npm ci
      
      - name: 🧪 Run React tests
        working-directory: ./frontend_finale
        run: npm test -- --watchAll=false --passWithNoTests
      
      - name: 🏗️ Build React app
        working-directory: ./frontend_finale
        run: npm run build

  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: 📦 Install flake8
        run: pip install flake8
      
      - name: 🔍 Lint Python code
        working-directory: ./backend
        run: |
          # Arrêter le build sur les erreurs de syntaxe ou noms non définis
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warnings (non bloquant)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true
      
      - name: 📦 Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: 📚 Install frontend_finale dependencies
        working-directory: ./frontend_finale
        run: npm ci
      
      - name: 🔍 Lint React code
        working-directory: ./frontend_finale
        run: npm run lint || echo "⚠️ Linting warnings found"
        continue-on-error: true