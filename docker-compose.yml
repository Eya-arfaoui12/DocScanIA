# Version de la syntaxe Docker Compose == > La ligne version: '....' dans docker-compose.yml n'est plus nécessaire depuis Docker Compose v2.

services:   # définis tous les services qui seront créés : database, backend, frontend…
  # ==========================================
  # BASE DE DONNÉES PostgreSQL
  # ==========================================
  db:  #Déclaration du service db (base de données PostgreSQL).
    image: postgres:18-alpine  ############ Utilise l’image Docker officielle PostgreSQL version 16, légère (alpine).
    container_name: doc_classifier_db #Le conteneur aura ce nom dans Docker.
    volumes:   # Persiste les données dans un volume externe, sinon tu perds la DB à chaque redémarrage.
      - postgres_data:/var/lib/postgresql/data
    environment:  #Variables d’environnement pour configurer PostgreSQL.
      POSTGRES_DB: ${DB_NAME:-doc_classifier}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      #${VAR:-default} = prend variable .env sinon utilise une valeur par défaut.
    ports:
      - "5433:5432"  #Mappe le port 5432 du conteneur au port 5432 de l’hôte (ton ordi).
    networks: # Connecte ce service au réseau défini plus bas.
      - app_network
    healthcheck: # Vérifie que PostgreSQL est prêt à accepter des connexions.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # BACKEND DJANGO
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doc_classifier_backend
    env_file:
    - ./backend/.env
    # ✅ AJOUTEZ CETTE SECTION (elle remplace /app/start.sh)
    command: >
      sh -c "
      echo '🚀 Démarrage du serveur Django...' &&
      echo '⏳ Attente de la base de données...' &&
      apt-get update && apt-get install -y netcat-traditional &&
      while ! nc -z db 5432; do sleep 1; done &&
      echo '✅ Base de données prête' &&
      echo '📊 Vérification du modèle ML...' &&
      python -c 'from ml_models.ml_service import get_classifier; get_classifier()' || echo '⚠️ Avertissement: Modèle ML non disponible' &&
      echo '🔄 Exécution des migrations...' &&
      python manage.py migrate --noinput &&
      echo '✅ Serveur prêt sur le port 8000' &&
      python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - ./backend:/app
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - DB_NAME=${DB_NAME:-doc_classifier}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres123}
      - DB_HOST=db
      - DB_PORT=5432
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - EMAIL_USE_SSL=${EMAIL_USE_SSL:-False}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==========================================
  # FRONTEND REACT
  # ==========================================
  frontend: #Déclaration du service frontend (React).
    build: #Construit l’image Docker à partir du Dockerfile dans le dossier ./frontend.
      context: ./frontend_finale  # Chemin vers le dossier frontend
      dockerfile: Dockerfile  # Nom du Dockerfile (optionnel si c’est "Dockerfile")
    container_name: doc_classifier_frontend # Nom du conteneur Docker pour le frontend.
    ports: # Mappe le port 80 du conteneur au port 80 de l’hôte.
      - "80:80"
    depends_on: # Assure que le frontend démarre après le backend.
      - backend
    networks: # Connecte ce service au réseau défini plus bas.
      - app_network
    environment: # Variables d’environnement pour configurer le frontend.
      - VITE_API_URL=http://localhost:8000 # URL de l’API backend.

volumes:  # Définition des volumes Docker pour persister les données.
  postgres_data: # Volume pour les données PostgreSQL.
  media_data: # Volume pour les fichiers médias (uploads).
  static_data: # Volume pour les fichiers statiques collectés.

networks: # Définition du réseau Docker pour la communication entre les services.
  app_network: # Nom du réseau.
    driver: bridge # Utilise le driver bridge (réseau par défaut de Docker).